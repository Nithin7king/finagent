name: finagent_flutter
description: "MYFY.AI (FinAgent) — Autonomous Personal Finance Assistant & Ledger"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Networking & Auth
  http: ^1.2.1

  # Local Persistence
  shared_preferences: ^2.2.3

  # Charts & Visualizations
  fl_chart: ^0.68.0

  # Typography (Fraunces, Inter, IBM Plex Mono)
  google_fonts: ^6.2.1

  # Internationalization & Currency Formatting (INR)
  intl: ^0.19.0

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
